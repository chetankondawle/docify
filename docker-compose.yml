services:
  yugabytedb:
    image: yugabytedb/yugabyte:latest
    container_name: docify-yugabyte
    ports:
      - "5433:5433"
      - "9042:9042"
      - "7000:7000"
    volumes:
      - yugabyte_data:/home/yugabyte/var
    command: >
      bash -c "
        yugabyted start --daemon=false --advertise_address=0.0.0.0 --insecure
      "
    healthcheck:
      test: ["CMD-SHELL", "ysqlsh -h 127.0.0.1 -U yugabyte -d yugabyte -c 'SELECT 1' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

volumes:
  yugabyte_data: